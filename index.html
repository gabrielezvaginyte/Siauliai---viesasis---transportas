<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaip nuvažiuoti – Šiaulių autobusai</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#0F1318;--panel:#161B22;--card:#1C222B;--line:#2E3640;--fg:#EEF1F4;--muted:#9BA6B2;--accent:#2BA88F;--c21:#D8CF5E;--c24:#E2765A;--c6:#2BA88F;--b:#F2B33D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
.app{display:flex;flex-wrap:wrap;min-height:100%}
.side{flex:1 1 320px;max-width:440px;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--panel)}
#map{flex:999 1 400px;min-height:320px;background:#12171D}
@media (max-width:760px){.side{max-width:none}#map{min-height:300px;height:300px}}
.field{display:flex;align-items:center;gap:10px}
.pin{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0F1318;flex-shrink:0}
.inp{flex:1;min-width:0;position:relative}
input[type=text]{width:100%;min-height:44px;padding:0 40px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:15px}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.mini{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mini:hover{color:var(--fg);background:var(--card)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.go{min-height:44px;border:0;border-radius:10px;background:var(--accent);color:#0F1318;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
.hint{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.msg{font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.opt{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:transparent;border:1px solid transparent;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.opt.sel{background:var(--card);border-color:var(--line)}
.opt:not(.sel):hover{background:#1a2028}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{min-width:30px;height:28px;padding:0 6px;border-radius:8px;font-size:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;color:#0F1318}
.time{margin-left:auto;font-size:18px;font-weight:800}
.time small{font-size:12px;font-weight:600;color:var(--muted)}
.arrow{color:var(--muted);font-size:14px}
.walkic{color:var(--muted);display:inline-flex}
ol.steps{list-style:none;margin:0;padding:0;display:none}
.opt.sel ol.steps{display:block}
ol.steps li{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.bar{width:4px;border-radius:2px;flex-shrink:0}
.bar.walk{background:repeating-linear-gradient(var(--muted) 0 4px,transparent 4px 8px)}
.st{display:flex;flex-direction:column;gap:2px;font-size:14px}
.st b{font-weight:700}
.st span{font-size:13px;color:var(--muted)}
.foot{margin-top:auto;font-size:12px;color:var(--muted)}
.leaflet-container{background:#12171D;font:inherit}
.leaflet-control-attribution{background:rgba(15,19,24,.8)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.lbl{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;font-weight:700;font-size:12px;padding:2px 6px;box-shadow:none}
.lbl:before{display:none}
</style>
</head>

</div>

</div>
<datalist id="stoplist"></datalist>

<p class="hint" id="hint">Įvesk adresą arba stotelę. Taškus A ir B gali pažymėti ir paspaudęs žemėlapyje.</p>
<div id="out" aria-live="polite"></div>
<p class="foot">Laikas apytikslis: skaičiuojama pagal atstumą, ne pagal tvarkaraštį.</p>
</section>

function dist(a, b){
  const R=6371000, toR=Math.PI/180;

      }}
  });

  D.forEach((s1, d1) => D.forEach((s2, d2) => {
    if (DATA.dirs[d1].r === DATA.dirs[d2].r) return;
    for (let i=0;i<s1.length;i++){ if (s1[i].wa>MAXWALK) continue;
      for (let k=i+1;k<s1.length;k++){
        for (let m=0;m<s2.length;m++){

          for (let j=m+1;j<s2.length;j++){ if (s2[j].wb>MAXWALK) continue;

              {type:'bus', di:d1, a:s1[i], b:s1[k], n:k-i},

  const best = opts.length ? opts[0].score : 0;

    if (o.legs.some(l => l.type==='bus' && l.n<1)) continue;

    if (o.kind!=='walk' && direct<1500 && o.t > walkMin(direct)) continue;
    seen.add(k); res.push(o); if (res.length===3) break;

async function resolve(text){
  const t = text.trim(); if (!t) return null;
  if (t==='Pažymėta vieta' || t==='Mano vieta') return 'keep';
  const sn = t.replace(/\s*\(stotelė\)$/,'').replace(/\s+st\.?$/,'').toLowerCase();

  o.legs.forEach(l => {
    if (l.type==='walk'){ const ll=[[l.from.lat,l.from.lon],[l.to.lat,l.to.lon]]; L.polyline(ll,{color:'#EEF1F4',weight:3,dashArray:'4 8',opacity:.9}).addTo(route); bounds.push(...ll); return; }
    const d=DATA.dirs[l.di], pts=slice(d,l.a.pos,l.b.pos);
    L.polyline(pts,{color:'#0F1318',weight:11,opacity:.9}).addTo(route);
    L.polyline(pts,{color:COL[d.r],weight:7}).addTo(route); bounds.push(...pts);
    [l.a,l.b].forEach(x => L.circleMarker([x.s.lat,x.s.lon],{radius:6,color:COL[d.r],weight:3,fillColor:'#0F1318',fillOpacity:1}).bindTooltip(x.s.n,{permanent:true,direction:'top',className:'lbl',offset:[0,-6]}).addTo(route));
  });
  if (bounds.length) map.fitBounds(bounds,{padding:[40,40]});
}
$('go').onclick = run;
['from','to'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') run(); }));
$('swap').onclick = () => { const v=$('from').value; $('from').value=$('to').value; $('to').value=v; const a=A; A=B; B=a;
  if(mA) map.removeLayer(mA); if(mB) map.removeLayer(mB); mA=mB=null; if(A) setPt('A',A); if(B) setPt('B',B); if(A&&B){ opts=plan(A,B); sel=0; render(); } };
$('loc').onclick = () => { if(!navigator.geolocation) return; navigator.geolocation.getCurrentPosition(p => { setPt('A',{lat:p.coords.latitude,lon:p.coords.longitude},'Mano vieta'); map.setView([p.coords.latitude,p.coords.longitude],15); }, () => { $('out').innerHTML='<div class="msg">Nepavyko nustatyti tavo vietos. Įvesk adresą ranka.</div>'; }); };
})();
</script>
